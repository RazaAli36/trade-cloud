name: trade-cloud
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade-cloud
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS || 'BTC,ETH,SOL,DOGE' }}
      - name: Save data and dashboard
        run: |
          git config user.name "trade-cloud"
          git config user.email "trade-cloud@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || (git commit -qm "scan" && git pull --rebase -q && git push -q)
